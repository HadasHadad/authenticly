<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTHENTICLY | Real or AI</title>
  
  <!-- פונטים יוקרתיים ועדכניים -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- הגדרות ומשתני הצבעים המקוריים שלך --- */
    :root {
        --white: #ffffff;
        --sage: #C0AB9A;
        --amber: #FFBF00;
        --burgundy: #4A0404;
        --light-bg: #fdfdfd;
        --pearl: #F7F5F2;
        --platinum: #CDA89A;
        --tuscany: #CDA89A;
        --raw-umber: #7B5C49;
        --old-burgundy: #43302E;
        --deep-asagi: #000000;
        
        /* תוספות קטנות לרכות העיצוב */
        --card-shadow: 0 20px 40px rgba(74, 4, 4, 0.06);
        --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Assistant', sans-serif;
        background: var(--pearl);
        color: var(--old-burgundy);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* --- Navbar מינימליסטי וממורכז --- */
    .navbar {
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px); /* אפקט זכוכית מודרני */
        padding: 20px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 1px solid rgba(192, 171, 154, 0.2);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .nav-links {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 50px;
        margin: 0;
        padding: 0;
    }

    .nav-links a {
        text-decoration: none;
        color: var(--burgundy);
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 1px;
        transition: var(--transition-smooth);
        position: relative;
        padding-bottom: 4px;
    }

    /* אפקט קו תחתון אלגנטי ב-Hover */
    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background-color: var(--amber);
        transition: var(--transition-smooth);
    }

    .nav-links a:hover {
        color: var(--raw-umber);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    /* --- כותרת פרימיום (Hero) --- */
    .hero {
        padding: 80px 20px 40px;
        text-align: center;
    }

    .main-title {
       font-family: 'Playfair Display', serif;
    font-size: 4.8rem;
    font-weight: 600;
    color: var(--burgundy);
    letter-spacing: 18px;
    margin-bottom: -14px;
    margin-top: -65px;
    }

    .amber-line {
        width: 50px;
        height: 2px;
        background-color: var(--amber);
        margin: 0 auto 20px;
        border-radius: 2px;
    }

    .subtitle {
        font-size: 1.15rem;
        color: var(--raw-umber);
        font-weight: 300;
        letter-spacing: 0.5px;
    }

    /* --- אזור הקרוסלה המרכזי --- */
    .main-content {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        padding-bottom: 80px;
    }

    .carousel-wrapper {
        max-width: 750px;
        width: 100%;
        padding: 20px;
        position: relative;
    }

    /* מסגרת התמונה המשודרגת */
    .image-container {
        position: relative;
        width: 100%;
        height: 480px;
        background-color: var(--white);
        border-radius: 16px; /* פינות מעוגלות ומודרניות */
        box-shadow: var(--card-shadow);
        overflow: hidden;
        transition: var(--transition-smooth);
        border: 1px solid rgba(192, 171, 154, 0.15);
    }

    .test-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
    }
    
    .image-container:hover .test-image {
        transform: scale(1.02); /* אפקט זום קטן ויפה בטעינה/ריחופ */
    }

    /* תגית שם הבדיקה מעל התמונה */
    .overlay-text {
        position: absolute;
        top: 20px;
        right: 20px;
        background-color: rgba(74, 4, 4, 0.9); /* בורגונדי חצי שקוף */
        backdrop-filter: blur(5px);
        color: var(--white);
        padding: 8px 18px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 30px;
        z-index: 5;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* --- כפתורי הצבעה מעוצבים מחדש --- */
    .vote-actions {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-top: 35px;
    }

    .btn {
        padding: 16px 48px;
        font-family: 'Assistant', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        border-radius: 50px; /* כפתורים עגולים ונעימים לעין */
        border: 2px solid var(--burgundy);
        transition: var(--transition-smooth);
        letter-spacing: 0.5px;
    }

    .btn-real {
        background-color: var(--white);
        color: var(--burgundy);
    }

    .btn-ai {
        background-color: var(--burgundy);
        color: var(--white);
    }

    .btn:hover {
        background-color: var(--amber);
        border-color: var(--amber);
        color: var(--burgundy);
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(255, 191, 0, 0.2);
    }
    
    .btn:active {
        transform: translateY(-1px);
    }

    /* סימון בחירה פעילה */
    .btn.active-choice {
        outline: none;
        border-color: var(--amber);
        background-color: var(--amber);
        color: var(--burgundy);
        box-shadow: 0 0 20px rgba(255, 191, 0, 0.4);
    }

    /* --- מד אחוזי הצבעה נקי ואלגנטי --- */
    .results-container {
        max-width: 550px;
        margin: 35px auto 0 auto;
    }

    .progress-bar {
        height: 6px; /* דק ומעודן יותר */
        width: 100%;
        background-color: rgba(192, 171, 154, 0.25);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
    }
    
    .fill-human { background-color: var(--sage); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .fill-ai { background-color: var(--burgundy); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    
    .stats-text {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--raw-umber);
        font-weight: 400;
    }
    
    .stats-text strong {
        color: var(--burgundy);
    }

    /* --- פוטר --- */
    .main-footer {
        background-color: var(--burgundy);
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        padding: 40px 0;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
    }

    .main-footer strong {
        color: var(--amber);
        font-weight: 600;
    }

    /* התאמות רספונסיביות למובייל */
    @media (max-width: 820px) {
        .main-title { font-size: 3.2rem; letter-spacing: 4px; }
        .image-container { height: 380px; }
        .nav-links { gap: 30px; }
    }

    .gallery-section {
  padding: 60px 20px;
  max-width: 900px;
  margin: 0 auto;
}

.gallery-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--burgundy);
  letter-spacing: 6px;
  text-align: center;
  margin-bottom: 8px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.gallery-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 3/4;
  cursor: pointer;
  border: 1px solid rgba(192, 171, 154, 0.2);
  transition: var(--transition-smooth);
}

.gallery-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 32px rgba(74, 4, 4, 0.1);
}

.gallery-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.gallery-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  background: linear-gradient(transparent, rgba(74, 4, 4, 0.75));
  color: var(--white);
  font-size: 0.8rem;
  letter-spacing: 1px;
  opacity: 0;
  transition: var(--transition-smooth);
}

.gallery-card:hover .gallery-label {
  opacity: 1;
}
  </style>
</head>
