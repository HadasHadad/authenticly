<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI or Not?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ai: #E24B4A;
      --human: #1D9E75;
      --unknown: #888780;
      --bg: #0a0a0a;
      --surface: #111;
      --card: #181818;
      --border: rgba(255,255,255,0.08);
      --text: #f0ede8;
      --muted: #888;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 3rem;
    }

    /* HERO BAR */
    .hero-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.8rem 0 1.2rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--ai); }
    .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .hero-btn {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .hero-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }
    .stat-val {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .stat-val.ai { color: var(--ai); }
    .stat-val.human { color: var(--human); }
    .stat-val.total { color: var(--text); }
    .stat-val.pct { color: #FAC775; }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      font-family: 'Space Mono', monospace;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--text); color: #000; border-color: transparent; }
    .filter-btn:hover:not(.active) { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .sort-wrap {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sort-label {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
    .sort-select {
      background: var(--card);
      color: var(--muted);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:hover { color: var(--text); }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 780px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } .stats-row { grid-template-columns: repeat(2, 1fr); } }

    /* CARDS */
    .card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: default;
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.18); }
    .card.voted-ai { border-color: rgba(226,75,74,0.5); }
    .card.voted-human { border-color: rgba(29,158,117,0.5); }

    .thumb-wrap { position: relative; }
    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }
    .media-type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .badge-video { background: #E24B4A; color: #fff; }
    .badge-image { background: #185FA5; color: #fff; }

    .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .play-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .verdict-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .verdict-ai { background: rgba(226,75,74,0.9); color: #fff; }
    .verdict-human { background: rgba(29,158,117,0.9); color: #fff; }
    .verdict-split { background: rgba(250,199,117,0.9); color: #000; }

    .card-body { padding: 10px 12px 12px; }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 10px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-bottom: 10px;
    }

    .vote-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      display: flex;
      margin-bottom: 4px;
    }
    .vote-bar-ai { background: var(--ai); height: 100%; transition: width 0.4s; }
    .vote-bar-human { background: var(--human); height: 100%; transition: width 0.4s; }
    .vote-counts {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      margin-bottom: 10px;
    }
    .ai-count { color: var(--ai); }
    .human-count { color: var(--human); }
    .total-c { color: var(--muted); }

    .vote-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .vote-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 7px 4px;
      border-radius: 6px;
      border: 0.5px solid;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      transition: all 0.15s;
      font-weight: 700;
    }
    .vote-btn-ai {
      border-color: rgba(226,75,74,0.4);
      background: rgba(226,75,74,0.07);
      color: var(--ai);
    }
    .vote-btn-ai:hover, .vote-btn-ai.selected {
      background: var(--ai);
      color: #fff;
      border-color: var(--ai);
    }
    .vote-btn-human {
      border-color: rgba(29,158,117,0.4);
      background: rgba(29,158,117,0.07);
      color: var(--human);
    }
    .vote-btn-human:hover, .vote-btn-human.selected {
      background: var(--human);
      color: #fff;
      border-color: var(--human);
    }

    /* DISTRIBUTION SECTION */
    .dist-section {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 0.5px solid var(--border);
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      margin-bottom: 1rem;
    }
    .dist-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .dist-row { display: flex; align-items: center; gap: 10px; }
    .dist-label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      width: 90px;
      text-align: right;
      flex-shrink: 0;
    }
    .dist-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .dist-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }
    .dist-pct {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      width: 24px;
      flex-shrink: 0;
    }

    .chart-wrap { position: relative; height: 200px; margin-top: 1rem; }

    /* EMPTY STATE */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero-bar">
      <div>
        <div class="logo">AI<span>or</span>Not?</div>
        <div class="tagline">Rate media — human or machine</div>
      </div>
      <a class="hero-btn" href="https://google.com/search?q=how+to+detect+AI+generated+images" target="_blank">איך לזהות AI?</a>
    </div>

    <div class="stats-row" id="globalStats"></div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">הכל</button>
      <button class="filter-btn" data-filter="image" onclick="setFilter('image', this)">תמונות</button>
      <button class="filter-btn" data-filter="video" onclick="setFilter('video', this)">סרטונים</button>
      <button class="filter-btn" data-filter="voted" onclick="setFilter('voted', this)">הצבעתי</button>
      <div class="sort-wrap">
        <span class="sort-label">מיון:</span>
        <select class="sort-select" onchange="setSort(this.value)">
          <option value="popular">פופולרי</option>
          <option value="controversial">שנוי במחלוקת</option>
          <option value="recent">חדש</option>
        </select>
      </div>
    </div>

    <div class="grid" id="mediaGrid"></div>

    <div class="dist-section">
      <div class="section-title">התפלגות הצבעות</div>
      <div class="dist-bars" id="distBars"></div>
      <div class="chart-wrap">
        <canvas id="confChart" role="img" aria-label="Distribution of AI confidence scores across all media items">
          Bar chart showing how items are distributed across AI confidence levels.
        </canvas>
      </div>
    </div>
  </div>

  <script>
    const ITEMS = [
      { id: 1, title: "שקיעה בים",       type: "image", src: "https://picsum.photos/seed/ai1/400/225",    ai: 342, human: 58,  tag: "landscape" },
      { id: 2, title: "ריקוד ברחוב",     type: "video", src: "https://picsum.photos/seed/vid2/400/225",   ai: 88,  human: 271, tag: "people" },
      { id: 3, title: "עיר עתידנית",     type: "image", src: "https://picsum.photos/seed/city3/400/225",  ai: 290, human: 110, tag: "architecture" },
      { id: 4, title: "חתול מגרד",       type: "video", src: "https://picsum.photos/seed/cat4/400/225",   ai: 44,  human: 389, tag: "animals" },
      { id: 5, title: "פרח קסום",        type: "image", src: "https://picsum.photos/seed/flow5/400/225",  ai: 201, human: 199, tag: "nature" },
      { id: 6, title: "ריצה על הירח",    type: "video", src: "https://picsum.photos/seed/moon6/400/225",  ai: 410, human: 30,  tag: "sci-fi" },
      { id: 7, title: "שוק פריז",        type: "image", src: "https://picsum.photos/seed/paris7/400/225", ai: 65,  human: 318, tag: "travel" },
      { id: 8, title: "רובוט מבשל",      type: "video", src: "https://picsum.photos/seed/robot8/400/225", ai: 375, human: 45,  tag: "tech" },
      { id: 9, title: "ילדים משחקים",   type: "image", src: "https://picsum.photos/seed/kids9/400/225",  ai: 55,  human: 290, tag: "people" },
    ];

    let votes = {};
    try { votes = JSON.parse(localStorage.getItem('aion_votes') || '{}'); } catch(e) {}

    let filter = 'all';
    let sortMode = 'popular';
    let confChartInstance = null;

    function saveVotes() {
      try { localStorage.setItem('aion_votes', JSON.stringify(votes)); } catch(e) {}
    }

    function vote(id, type) {
      const item = ITEMS.find(i => i.id === id);
      if (!item) return;
      const prev = votes[id];
      if (prev) item[prev]--;
      if (prev === type) {
        delete votes[id];
      } else {
        votes[id] = type;
        item[type]++;
      }
      saveVotes();
      render();
      renderStats();
      renderDist();
    }

    function getVerdict(item) {
      const total = item.ai + item.human;
      if (total < 10) return null;
      const pct = item.ai / total;
      if (pct > 0.65) return 'ai';
      if (pct < 0.35) return 'human';
      return 'split';
    }

    function getFiltered() {
      let arr = [...ITEMS];
      if (filter === 'image') arr = arr.filter(i => i.type === 'image');
      if (filter === 'video') arr = arr.filter(i => i.type === 'video');
      if (filter === 'voted') arr = arr.filter(i => votes[i.id]);
      if (sortMode === 'popular')
        arr.sort((a, b) => (b.ai + b.human) - (a.ai + a.human));
      if (sortMode === 'controversial')
        arr.sort((a, b) => {
          const ra = Math.min(a.ai, a.human) / ((a.ai + a.human) || 1);
          const rb = Math.min(b.ai, b.human) / ((b.ai + b.human) || 1);
          return rb - ra;
        });
      return arr;
    }

    function render() {
      const grid = document.getElementById('mediaGrid');
      const items = getFiltered();

      if (!items.length) {
        grid.innerHTML = '<div class="empty">אין פריטים להצגה</div>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const total = item.ai + item.human;
        const aiPct = total ? Math.round(item.ai / total * 100) : 50;
        const humanPct = 100 - aiPct;
        const myVote = votes[item.id];
        const verdict = getVerdict(item);

        const verdictHTML = verdict
          ? `<div class="verdict-tag verdict-${verdict}">${verdict === 'ai' ? 'AI' : verdict === 'human' ? 'אנושי' : 'שנוי'}</div>`
          : '';

        const playHTML = item.type === 'video'
          ? `<div class="play-icon"><div class="play-circle">
               <svg width="12" height="14" viewBox="0 0 12 14" fill="white"><polygon points="1,1 11,7 1,13"/></svg>
             </div></div>`
          : '';

        return `
          <div class="card${myVote ? ' voted-' + myVote : ''}" id="card-${item.id}">
            <div class="thumb-wrap">
              <img class="thumb" src="${item.src}" alt="${item.title}" loading="lazy" />
              <div class="media-type-badge badge-${item.type}">${item.type === 'video' ? 'video' : 'image'}</div>
              ${playHTML}
              ${verdictHTML}
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-meta">${total.toLocaleString()} הצבעות · #${item.tag}</div>
              <div class="vote-bar">
                <div class="vote-bar-ai" style="width:${aiPct}%"></div>
                <div class="vote-bar-human" style="width:${humanPct}%"></div>
              </div>
              <div class="vote-counts">
                <span class="ai-count">AI ${aiPct}%</span>
                <span class="total-c">${total}</span>
                <span class="human-count">${humanPct}% אנושי</span>
              </div>
              <div class="vote-btns">
                <button class="vote-btn vote-btn-ai${myVote === 'ai' ? ' selected' : ''}" onclick="vote(${item.id}, 'ai')">AI</button>
                <button class="vote-btn vote-btn-human${myVote === 'human' ? ' selected' : ''}" onclick="vote(${item.id}, 'human')">אנושי</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderStats() {
      const totalVotes = Object.keys(votes).length;
      const aiVotes = Object.values(votes).filter(v => v === 'ai').length;
      const humanVotes = totalVotes - aiVotes;
      const totalRatings = ITEMS.reduce((s, i) => s + i.ai + i.human, 0);
      const aiPct = totalRatings
        ? Math.round(ITEMS.reduce((s, i) => s + i.ai, 0) / totalRatings * 100)
        : 0;

      document.getElementById('globalStats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">סה"כ דירוגים</div>
          <div class="stat-val total">${totalRatings.toLocaleString()}</div>
          <div class="stat-sub">על ${ITEMS.length} פריטים</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">הצבעות AI</div>
          <div class="stat-val ai">${aiPct}%</div>
          <div class="stat-sub">מדרגים כ-AI</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">הצבעתי</div>
          <div class="stat-val total">${totalVotes}</div>
          <div class="stat-sub">${aiVotes} AI · ${humanVotes} אנושי</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">שנויים במח'</div>
          <div class="stat-val pct">${ITEMS.filter(i => getVerdict(i) === 'split').length}</div>
          <div class="stat-sub">50/50 splits</div>
        </div>`;
    }

    function renderDist() {
      const labels  = ['בטוח אנושי', 'כנראה אנושי', 'לא ברור', 'כנראה AI', 'בטוח AI'];
      const colors  = ['#1D9E75', '#5DCAA5', '#FAC775', '#F09595', '#E24B4A'];
      const counts  = [0, 0, 0, 0, 0];

      ITEMS.forEach(item => {
        const t = item.ai + item.human;
        if (!t) return;
        const p = item.ai / t;
        const idx = Math.min(4, Math.floor(p / 0.2));
        counts[idx]++;
      });

      const max = Math.max(...counts) || 1;

      document.getElementById('distBars').innerHTML = counts.map((c, i) => `
        <div class="dist-row">
          <div class="dist-label">${labels[i]}</div>
          <div class="dist-track">
            <div class="dist-fill" style="width:${Math.round(c / max * 100)}%; background:${colors[i]}"></div>
          </div>
          <div class="dist-pct" style="color:${colors[i]}">${c}</div>
        </div>`).join('');

      const ctx = document.getElementById('confChart');
      if (confChartInstance) { confChartInstance.destroy(); confChartInstance = null; }
      confChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['0-20%', '20-40%', '40-60%', '60-80%', '80-100%'],
          datasets: [{
            label: 'מספר פריטים',
            data: counts,
            backgroundColor: colors,
            borderRadius: 4,
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => `${ctx.raw} פריטים` } }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { color: '#888', font: { family: 'Space Mono', size: 10 } }
            },
            y: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { color: '#888', font: { family: 'Space Mono', size: 10 }, stepSize: 1 }
            }
          }
        }
      });
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setSort(s) { sortMode = s; render(); }

    // init
    render();
    renderStats();
    renderDist();
  </script>
</body>
</html>
